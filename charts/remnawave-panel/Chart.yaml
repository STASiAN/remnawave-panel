apiVersion: v2
name: remnawave-panel
description: A Helm chart for deploying Remnawave Panel on Kubernetes
type: application
version: 0.7.0
appVersion: "3.2.3"
home: https://remnawave.github.io/panel
sources:
  - https://github.com/remnawave/backend
  - https://github.com/remnawave/remnawave-panel
keywords:
  - remnawave
  - vpn
  - panel
maintainers:
  - name: remnawave
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: |
        HTTP→HTTPS redirect for Gateway API mode, on by default. When
        gateway.httpsRedirect.enabled (default true) the chart renders a second
        HTTPRoute per host carrying a RequestRedirect filter (301 by default).
        With gateway.createGateway=true it is automatic: the redirect route
        takes the chart-managed Gateway's `http` listener and the serving route
        its `https` listener. For an externally-managed Gateway, set
        gateway.httpsRedirect.parentRefs (and subscription.gateway
        .httpsRedirect.parentRefs when the subscription uses its own Gateway)
        to that Gateway's HTTP listener — until then no redirect route is
        rendered, so existing installs are unaffected.
dependencies:
  - name: cluster
    version: "0.6.0"
    repository: "https://cloudnative-pg.github.io/charts"
    alias: cnpg
    condition: cnpg.enabled
  - name: redis-ha
    version: "4.35.10"
    repository: "https://dandydeveloper.github.io/charts/"
    condition: redis-ha.enabled
