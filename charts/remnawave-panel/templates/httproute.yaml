{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "remnawave-panel.fullname" . }}
  labels:
    {{- include "remnawave-panel.labels" . | nindent 4 }}
  {{- with .Values.gateway.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.gateway.gatewayName }}
    - name: {{ .Values.gateway.gatewayName }}
    {{- else if .Values.gateway.createGateway }}
    - name: {{ include "remnawave-panel.fullname" . }}
      {{- if eq (include "remnawave-panel.gateway.httpsRedirect.render" .) "true" }}
      {{- /* the redirect route owns the http listener; serve on https only */}}
      sectionName: https
      {{- end }}
    {{- end }}
    {{- range .Values.gateway.parentRefs }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if .Values.gateway.hostnames }}
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "remnawave-panel.fullname" . }}
          port: {{ .Values.app.port }}
{{- end }}
