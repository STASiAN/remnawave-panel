apiVersion: v1
entries:
  remnawave-panel:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: |
            Re-add Gateway API support: gateway.* values render a panel HTTPRoute
            (plus an optional chart-managed Gateway via gateway.createGateway), and
            subscription.gateway.hostnames renders a subscription HTTPRoute backed
            by the subscription Service. ingress.enabled and gateway.enabled remain
            mutually exclusive; SUB_PUBLIC_DOMAIN derivation understands both.
            Requires Gateway API CRDs (gateway.networking.k8s.io/v1).
        - kind: changed
          description: |
            Move subscription-page from a sidecar container in the panel Pod to its
            own Deployment and Service (<fullname>-subscription). It now scales
            independently via subscription.replicaCount and reaches the panel
            through the panel Service instead of localhost. The subscription
            Ingress backend points at the new Service; the panel Service no longer
            exposes the subscription port.
    apiVersion: v2
    appVersion: 3.2.3
    created: "2026-08-12T13:37:33.041389035Z"
    dependencies:
    - alias: cnpg
      condition: cnpg.enabled
      name: cluster
      repository: https://cloudnative-pg.github.io/charts
      version: 0.6.0
    - condition: redis-ha.enabled
      name: redis-ha
      repository: https://dandydeveloper.github.io/charts/
      version: 4.35.10
