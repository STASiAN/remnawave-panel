{{- if eq (include "remnawave-panel.subscription.httpsRedirect.render" .) "true" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-https-redirect" (include "remnawave-panel.subscription.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "remnawave-panel.subscription.labels" . | nindent 4 }}
  {{- with .Values.subscription.gateway.httpsRedirect.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.subscription.gateway.httpsRedirect.parentRefs }}
    {{- range .Values.subscription.gateway.httpsRedirect.parentRefs }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- else if .Values.gateway.httpsRedirect.parentRefs }}
    {{- range .Values.gateway.httpsRedirect.parentRefs }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- else }}
    - name: {{ include "remnawave-panel.fullname" . }}
      sectionName: http
    {{- end }}
  hostnames:
    {{- range .Values.subscription.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: {{ include "remnawave-panel.subscription.httpsRedirect.statusCode" . }}
{{- end }}
